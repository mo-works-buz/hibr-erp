name: Keep Supabase awake
on:
  schedule:
    - cron: '0 5 */2 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping database
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            "https://aemjfxbdxmmyfeqxkjsk.supabase.co/rest/v1/settings?select=key&limit=1" \
            -H "apikey: sb_publishable_vb3YEUS-vvzEVYQssdY4qQ_fopFDgXg" \
            -H "Authorization: Bearer sb_publishable_vb3YEUS-vvzEVYQssdY4qQ_fopFDgXg"
      - name: Record heartbeat (keeps schedule active)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "hibr-keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .keepalive
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push
